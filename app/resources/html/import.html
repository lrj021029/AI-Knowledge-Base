<!-- 导入演示页面，用于上传文档并观察导入状态。与 chat.html 共用同一套设计语言。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="听书知识库 · 新书入库：上传 PDF / Markdown，抽取听书元数据并写入知识库。" />
<title>新书入库 · 听书知识库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23472913'/%3E%3Cpath d='M9 8h14v16H9z' fill='%23e4e0cf'/%3E%3Cpath d='M9 8h14v4H9z' fill='%23c79a3e'/%3E%3Cpath d='M13 8h6v2h-6z' fill='%23525e1b'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
  /* ============================================================
     共享设计系统（与 chat.html / book-recommend.html 保持一致）
     色板：tobacco 地色 + bone 纸 + 赭黄卡口 + 橄榄重点色
     ============================================================ */
  :root{
    --bg:#472913;
    --surface:#55321a;
    --surface-deep:#3a2110;
    --ink:#e4e0cf;
    --muted:#b39f84;
    --accent:#525e1b;
    --accent-strong:#67721f;
    --accent-ink:#e4e0cf;
    --field-1:#c79a3e;
    --field-1-ink:#2b170a;
    --paper:#e4e0cf;
    --paper-ink:#2b170a;
    --paper-deep:#d5cdb2;
    --paper-muted:rgba(43,23,10,.66);

    --font-display:"Zilla Slab","Songti SC","Noto Serif SC",Georgia,"SimSun",serif;
    --font-text:"Zilla Slab",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

    --step-small:clamp(0.8125rem,0.79rem + 0.1vw,0.875rem);
    --step-body:clamp(1.0625rem,1rem + 0.25vw,1.1875rem);
    --step-lead:clamp(1.25rem,1.1rem + 0.7vw,1.625rem);
    --step-head:clamp(1.75rem,1.2rem + 2.2vw,2.75rem);
    --step-display:clamp(2.75rem,9vw,7rem);

    --margin:clamp(1rem,2.2vw,2rem);
    --radius:0;
    --ease-out:cubic-bezier(0.22,1,0.36,1);
    --t-press:140ms;--t-hover:180ms;--t-ui:240ms;--t-reveal:700ms;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:var(--font-text);font-size:var(--step-body);line-height:1.5;
    font-kerning:normal;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
    min-height:100vh;min-height:100dvh; /* taste-skill-ignore: 100vh 仅作旧浏览器回退，紧随其后为 100dvh */
  }
  ::selection{background:var(--field-1);color:var(--field-1-ink)}
  :focus-visible{outline:2px solid var(--field-1);outline-offset:2px}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:var(--margin);top:8px;z-index:50;background:var(--field-1);color:var(--field-1-ink);padding:8px 12px;font-size:var(--step-small)}
  .vhidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:var(--margin)}

  /* ---- 顶部横条 ---- */
  .bar{display:flex;align-items:center;gap:clamp(12px,2vw,28px);padding-block:clamp(12px,1.8vw,18px)}
  .wordmark{font-family:var(--font-display);font-weight:600;font-size:clamp(1.125rem,1rem + .6vw,1.4rem);letter-spacing:-.01em;line-height:1;color:var(--ink);text-decoration:none;white-space:nowrap}
  .bar__nav{margin-left:auto;display:flex;align-items:center;gap:clamp(10px,1.6vw,24px)}
  .tlink{font-size:var(--step-small);color:var(--muted);text-decoration:none;padding:8px 2px;transition:color var(--t-hover) ease}
  .tlink:hover{color:var(--ink)}
  .tlink[aria-current="page"]{color:var(--field-1)}

  /* ---- 首屏 ---- */
  .opening{width:fit-content;max-width:100%;margin-block:clamp(16px,3.4vh,36px) clamp(18px,3vh,30px)}
  .opening__tab{
    display:block;width:fit-content;margin:0 16px 0 auto;
    clip-path:polygon(12px 0,100% 0,100% 100%,0 100%);
    background:var(--field-1);color:var(--field-1-ink);
    font-family:var(--font-display);font-weight:600;font-size:var(--step-small);
    padding:4px 20px 5px;
  }
  .opening__panel{background:var(--paper);color:var(--paper-ink);padding:clamp(24px,3.4vw,40px)}
  .opening__title{font-family:var(--font-display);font-weight:600;font-size:var(--step-display);line-height:1;letter-spacing:-.035em;margin:0;width:fit-content;max-width:100%;text-wrap:balance}
  .opening__note{margin:1em 0 0;max-width:36rem;color:var(--paper-muted);line-height:1.55;text-wrap:pretty}

  /* ---- 纸面板 ---- */
  .panel{background:var(--paper);color:var(--paper-ink);margin-bottom:clamp(16px,2.4vh,24px)}
  .panel__title,.panel__summary{
    font-family:var(--font-display);font-weight:600;font-size:var(--step-lead);
    letter-spacing:-.01em;margin:0;padding:clamp(16px,2vw,22px) clamp(20px,3vw,32px) 0;
  }
  summary.panel__summary{cursor:pointer;user-select:none;list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;padding-bottom:0}
  summary.panel__summary::-webkit-details-marker{display:none}
  summary.panel__summary::after{content:"展开";font-family:var(--font-text);font-weight:400;font-size:var(--step-small);color:var(--paper-muted);margin-left:auto}
  details[open] summary.panel__summary::after{content:"收起"}
  .panel__hint{font-family:var(--font-text);font-weight:400;font-size:var(--step-small);color:var(--paper-muted)}
  .panel__body{padding:clamp(14px,2vw,18px) clamp(20px,3vw,32px) clamp(20px,3vw,30px)}

  /* ---- 元数据表单 ---- */
  .meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
  .field{display:flex;flex-direction:column;gap:6px;font-size:var(--step-small);color:var(--paper-muted)}
  .field input,.field select{
    font:inherit;font-size:var(--step-body);color:var(--paper-ink);
    background:var(--paper-deep);border:0;border-radius:var(--radius);
    padding:11px 12px;outline:none;width:100%;
    transition:background var(--t-hover) ease;
  }
  .field input::placeholder{color:var(--paper-muted)}
  .field input:focus,.field select:focus{background:var(--paper)}
  .field select{appearance:none;background-image:none}

  /* ---- 投放区 ---- */
  .drop{
    background:var(--paper-deep);border:2px dashed var(--paper-muted);
    padding:clamp(20px,3.4vw,34px);text-align:center;cursor:pointer;
    transition:background var(--t-hover) ease;
  }
  .drop.is-over{background:var(--accent)}
  .drop__text{margin:0;font-family:var(--font-display);font-weight:600;font-size:var(--step-lead)}
  .drop__sub{margin:6px 0 0;font-size:var(--step-small);color:var(--paper-muted)}
  .drop.is-over .drop__sub{color:var(--accent-ink)}
  .drop__actions{margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

  .btn-solid{
    font-family:var(--font-display);font-weight:600;font-size:var(--step-body);
    background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--radius);
    padding:13px 24px;min-height:48px;cursor:pointer;
    transition:background var(--t-hover) ease,transform var(--t-press) var(--ease-out);
  }
  .btn-solid:hover{background:var(--accent-strong)}
  .btn-solid:active{transform:scale(.98)}
  .btn-quiet{
    font-family:var(--font-display);font-weight:600;font-size:var(--step-body);
    background:var(--paper);color:var(--paper-ink);border:0;border-radius:var(--radius);
    padding:13px 22px;min-height:48px;cursor:pointer;
    transition:background var(--t-hover) ease,transform var(--t-press) var(--ease-out);
  }
  .btn-quiet:hover{background:var(--paper)}
  .btn-quiet:active{transform:scale(.98)}

  /* ---- 文件卡（地色上一张张纸） ---- */
  .filelist{display:flex;flex-direction:column;gap:clamp(12px,1.8vh,18px)}
  .file{background:var(--paper);color:var(--paper-ink);padding-bottom:14px}
  .file__tab{
    display:inline-block;margin:12px 0 0 14px;
    clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);
    background:var(--field-1);color:var(--field-1-ink);
    font-family:var(--font-display);font-weight:600;font-size:var(--step-small);
    padding:3px 17px 4px;
  }
  .file[data-state="done"] .file__tab{background:var(--accent);color:var(--accent-ink)}
  .file[data-state="failed"] .file__tab{background:var(--paper-ink);color:var(--paper)}
  .file__body{display:block;padding:10px 20px 0}
  .file__name{display:block;font-family:var(--font-display);font-weight:600;font-size:var(--step-lead);line-height:1.25;overflow-wrap:anywhere}
  .file__size{display:block;margin-top:5px;font-size:var(--step-small);color:var(--paper-muted)}
  .steps{margin-top:12px}
  .steps summary{
    cursor:pointer;user-select:none;list-style:none;
    font-size:var(--step-small);color:var(--paper-muted);
    display:flex;align-items:center;gap:8px;
  }
  .steps summary::-webkit-details-marker{display:none}
  .steps summary::before{content:"";width:8px;height:8px;background:var(--accent);flex:0 0 auto}
  .steps[open] summary::before{background:var(--paper-ink)}
  .steps__list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
  .steps__list li{position:relative;padding-left:20px;font-size:var(--step-small);color:var(--paper-muted);line-height:1.45}
  .steps__list li::before{content:"";position:absolute;left:0;top:.42em;width:8px;height:8px;background:var(--accent)}
  .steps__list li.is-run{color:var(--paper-ink)}
  .steps__list li.is-run::before{background:var(--paper-ink)}
  .steps__list li.is-pending::before{background:transparent}

  /* ---- 入场 ---- */
  @media (prefers-reduced-motion: no-preference){
    .js [data-rise]{opacity:0;transform:translateY(16px);animation:rise var(--t-reveal) var(--ease-out) forwards;animation-delay:calc(var(--i,0) * 80ms + 100ms)}
    .js .file{animation:rise var(--t-reveal) var(--ease-out) both}
  }
  @keyframes rise{to{opacity:1;transform:none}}

  @media (max-width:640px){
    .bar__nav{gap:14px}
    .opening__tab{margin-right:10px}
    .meta-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
  <a class="skip" href="#dropZone">跳到上传</a>

  <header class="bar wrap">
    <a class="wordmark" href="http://127.0.0.1:8001/html" data-rise style="--i:0">听书知识库</a>
    <nav class="bar__nav" aria-label="页面导航">
      <a class="tlink" href="http://127.0.0.1:8001/html" data-rise style="--i:1">对话</a>
      <a class="tlink" href="http://127.0.0.1:8001/html/book-recommend" data-rise style="--i:2">精品推荐</a>
    </nav>
  </header>

  <main class="wrap" style="padding-bottom:clamp(40px,7vh,80px)">
    <section class="opening">
      <span class="opening__tab" data-rise style="--i:3">导入</span>
      <div class="opening__panel">
        <h1 class="opening__title" data-rise style="--i:4">新书入库</h1>
        <p class="opening__note" data-rise style="--i:5">上传 PDF 或 Markdown，系统抽取听书元数据并写入知识库。下面的字段可手动填写，优先于模型自动抽取的结果。</p>
      </div>
    </section>

    <details class="panel" id="metaPanel" data-rise style="--i:6">
      <summary class="panel__summary">听书元数据 <span class="panel__hint">可选 · 手动填写优先</span></summary>
      <div class="panel__body">
        <div class="meta-grid">
          <label class="field">书名<input type="text" id="metaBookName" placeholder="如：三体"></label>
          <label class="field">作者名<input type="text" id="metaAuthorName" placeholder="如：刘慈欣"></label>
          <label class="field">内容类型
            <select id="metaContentType">
              <option value="">自动识别</option>
              <option value="有声书信息">有声书信息</option>
              <option value="书籍简介">书籍简介</option>
              <option value="作者介绍">作者介绍</option>
              <option value="听书笔记">听书笔记</option>
              <option value="推荐运营资料">推荐运营资料</option>
              <option value="用户评论摘要">用户评论摘要</option>
              <option value="常见问答">常见问答</option>
            </select>
          </label>
          <label class="field">类别
            <select id="metaCategory">
              <option value="">自动识别</option>
              <option value="科幻">科幻</option>
              <option value="悬疑">悬疑</option>
              <option value="文学">文学</option>
              <option value="历史">历史</option>
              <option value="教育">教育</option>
              <option value="儿童">儿童</option>
              <option value="小说">小说</option>
              <option value="非小说">非小说</option>
            </select>
          </label>
          <label class="field">类别标签（多选用、分隔）<input type="text" id="metaCategoryTags" placeholder="如：科幻、悬疑"></label>
          <label class="field">场景标签（多选用、分隔）<input type="text" id="metaSceneTags" placeholder="如：通勤、睡前"></label>
          <label class="field">有声时长<input type="text" id="metaAudioDuration" placeholder="如：12小时30分钟"></label>
          <label class="field">演播人<input type="text" id="metaNarrator" placeholder="如：李野默"></label>
          <label class="field">听书亮点（多选用、分隔）<input type="text" id="metaHighlights" placeholder="如：情节紧凑、声临其境"></label>
          <label class="field">适合人群<input type="text" id="metaSuitableAudience" placeholder="如：科幻爱好者"></label>
          <label class="field">来源链接 / 路径<input type="text" id="metaSourcePath" placeholder="可选"></label>
        </div>
      </div>
    </details>

    <section class="panel" data-rise style="--i:7">
      <h2 class="panel__title">文件</h2>
      <div class="panel__body">
        <div class="drop" id="dropZone" role="button" tabindex="0" aria-label="把 PDF 或 Markdown 拖到这里，或点此选择文件">
          <p class="drop__text">把文件拖到这里</p>
          <p class="drop__sub">PDF · Markdown，可多选</p>
          <div class="drop__actions">
            <button type="button" class="btn-solid" id="pickFiles">选择文件</button>
            <button type="button" class="btn-quiet" id="pickFolder">选择文件夹</button>
          </div>
        </div>
        <input type="file" id="fileInput" class="vhidden" multiple accept=".pdf,.md">
        <input type="file" id="folderInput" class="vhidden" webkitdirectory directory multiple>
      </div>
    </section>

    <section class="filelist" id="fileList" aria-live="polite"></section>
  </main>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const folderInput = document.getElementById('folderInput');
  const fileList = document.getElementById('fileList');

  // 默认走导入服务同源地址；如你把页面单独打开（file://），回退到导入服务默认端口。
  const API_BASE = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8000';

  const ALLOWED_EXT = ['.pdf', '.md'];
  function isAllowed(file) {
    const name = (file.name || '').toLowerCase();
    return ALLOWED_EXT.some(ext => name.endsWith(ext));
  }
  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
  }

  // 采集手动填写的听书元数据（空字符串字段由后端过滤，不覆盖自动抽取）
  function collectManualMeta() {
    const get = (id) => (document.getElementById(id)?.value || '').trim();
    return {
      book_name: get('metaBookName'),
      author_name: get('metaAuthorName'),
      content_type: get('metaContentType'),
      category: get('metaCategory'),
      category_tags: get('metaCategoryTags'),
      scene_tags: get('metaSceneTags'),
      audio_duration: get('metaAudioDuration'),
      narrator: get('metaNarrator'),
      highlights: get('metaHighlights'),
      suitable_audience: get('metaSuitableAudience'),
      source_path: get('metaSourcePath'),
    };
  }

  // ====== 选择文件 ======
  document.getElementById('pickFiles').addEventListener('click', (e) => {
    e.stopPropagation();
    fileInput.click();
  });
  document.getElementById('pickFolder').addEventListener('click', (e) => {
    e.stopPropagation();
    folderInput.click();
  });
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('is-over');
  });
  dropZone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dropZone.classList.remove('is-over');
  });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('is-over');
    handleFiles(e.dataTransfer.files);
  });

  fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
  folderInput.addEventListener('change', (e) => handleFiles(e.target.files));

  function handleFiles(files) {
    Array.from(files).filter(isAllowed).forEach(uploadFile);
  }

  // ====== 上传单个文件 ======
  async function uploadFile(file) {
    const id = 'file-' + Math.random().toString(36).slice(2, 11);
    const html = `
      <article class="file" id="${id}" data-state="uploading">
        <span class="file__tab">上传中</span>
        <span class="file__body">
          <span class="file__name">${escapeHtml(file.name)}</span>
          <span class="file__size">${(file.size / 1024).toFixed(2)} KB</span>
          <details class="steps">
            <summary>日志 · 等待服务响应</summary>
            <ul class="steps__list"><li class="is-pending">等待服务响应</li></ul>
          </details>
        </span>
      </article>`;
    fileList.insertAdjacentHTML('afterbegin', html);

    const itemEl = document.getElementById(id);
    const formData = new FormData();
    formData.append('files', file);
    const manualMeta = collectManualMeta();
    Object.keys(manualMeta).forEach((key) => {
      if (manualMeta[key]) formData.append(key, manualMeta[key]);
    });

    try {
      const response = await fetch(`${API_BASE}/upload`, { method: 'POST', body: formData });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const result = await response.json();
      const taskId = result.task_ids[0];
      itemEl.dataset.state = 'processing';
      itemEl.querySelector('.file__tab').textContent = '处理中';
      pollStatus(taskId, itemEl);
    } catch (error) {
      console.error(error);
      itemEl.dataset.state = 'failed';
      itemEl.querySelector('.file__tab').textContent = '失败';
    }
  }

  // ====== 日志 / 状态 ======
  function normalizeDoneLog(text) {
    if (typeof text !== 'string') return String(text);
    return text.endsWith('已完成') ? text : `${text}已完成`;
  }
  function normalizeRunningLog(text) {
    if (typeof text !== 'string') return String(text);
    if (text.startsWith('正在进行')) return text.endsWith('...') ? text : `${text}...`;
    return `正在进行${text}...`;
  }
  function renderLogs(itemEl, doneList, runningList) {
    const logSummary = itemEl.querySelector('.steps summary');
    const logListEl = itemEl.querySelector('.steps__list');
    const logDetails = itemEl.querySelector('.steps');
    const done = Array.isArray(doneList) ? doneList : [];
    const running = Array.isArray(runningList) ? runningList : [];

    logSummary.textContent = `日志 · 已完成${done.length} 步${running.length ? ` · 进行中${running.length} 步` : ''}`;

    logListEl.innerHTML = '';
    const lines = [...done.map(normalizeDoneLog), ...running.map(normalizeRunningLog)];
    if (lines.length === 0) {
      const li = document.createElement('li');
      li.textContent = '暂无日志';
      logListEl.appendChild(li);
      logDetails.open = false;
    } else {
      for (const line of lines) {
        const li = document.createElement('li');
        li.className = line.startsWith('正在进行') ? 'is-run' : 'is-done';
        li.textContent = line;
        logListEl.appendChild(li);
      }
    }
  }

  function renderMeta(itemEl, meta) {
    if (!meta || Object.keys(meta).length === 0) return;
    const logListEl = itemEl.querySelector('.steps__list');
    if (!logListEl) return;
    const li = document.createElement('li');
    const parts = [];
    if (meta.book_name) parts.push(`书名:${meta.book_name}`);
    if (meta.author_name) parts.push(`作者:${meta.author_name}`);
    if (meta.content_type) parts.push(`类型:${meta.content_type}`);
    if (meta.category) parts.push(`类别:${meta.category}`);
    if (meta.category_tags) parts.push(`标签:${String(meta.category_tags).replace(/\|/g, ' ').trim()}`);
    if (meta.scene_tags) parts.push(`场景:${meta.scene_tags}`);
    if (meta.audio_duration) parts.push(`时长:${meta.audio_duration}`);
    if (meta.meta_source) parts.push(`来源:${meta.meta_source === 'manual' ? '手动填写优先' : '模型抽取'}`);
    li.textContent = `元数据 · ${parts.join(' | ')}`;
    logListEl.appendChild(li);
  }

  function pollStatus(taskId, itemEl) {
    const interval = setInterval(async () => {
      try {
        const res = await fetch(`${API_BASE}/status/${taskId}`);
        const data = await res.json();
        renderLogs(itemEl, data.done_list, data.running_list);

        if (data.status === 'completed') {
          itemEl.dataset.state = 'done';
          itemEl.querySelector('.file__tab').textContent = '已完成';
          itemEl.querySelector('.steps').open = false;
          renderMeta(itemEl, data.audiobook_meta);
          clearInterval(interval);
        } else if (data.status === 'processing') {
          itemEl.dataset.state = 'processing';
          itemEl.querySelector('.file__tab').textContent = '处理中';
        } else if (data.status === 'failed') {
          itemEl.dataset.state = 'failed';
          itemEl.querySelector('.file__tab').textContent = '失败';
          renderLogs(itemEl, [...(data.done_list || []), `失败：${data.error || '未知错误'}`], []);
          clearInterval(interval);
        }
      } catch (e) {
        console.error('Polling error', e);
      }
    }, 2000);
  }
</script>
</body>
</html>
